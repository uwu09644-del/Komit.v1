name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Komit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Komit-apk
          path: Komit.apk

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete komit-latest --yes --cleanup-tag || true
          gh release create komit-latest Komit.apk \
            --target "$GITHUB_SHA" \
            --title "Komit (latest)" \
            --notes "Download Komit.apk on your Android phone and open it to install. Built from commit $GITHUB_SHA."
