plugins {
    id 'com.android.application'
}

android {
    namespace 'com.komit.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.komit.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    // A fixed key so every new APK installs over the old one and keeps all memories.
    // This key is public on purpose (it's only for your own sideloaded app).
    signingConfigs {
        komit {
            storeFile file('../komit.keystore')
            storePassword 'komitkomit'
            keyAlias 'komit'
            keyPassword 'komitkomit'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.komit
        }
        debug {
            signingConfig signingConfigs.komit
        }
    }

    // The app's content is the same web app as the website version (the docs/ folder).
    sourceSets {
        main {
            assets.srcDirs = ['../../docs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
